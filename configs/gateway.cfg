! Paste in global configuration mode on a Cisco 2911.
! SSH credentials and RSA keys are configured separately; see docs/packet-tracer.md.
hostname Lab-GW-Router
ip domain-name manufacturing.local
no ip domain-lookup
service password-encryption
interface GigabitEthernet0/0
 description WAN-TO-ISP
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 ip access-group WAN-INBOUND-ACL in
 no shutdown
interface GigabitEthernet0/1
 description TRUNK-TO-SWITCH
 no shutdown
interface GigabitEthernet0/1.10
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip nat inside
 ip access-group CORP-INBOUND-ACL in
interface GigabitEthernet0/1.20
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip access-group OT-INBOUND-ACL in
interface GigabitEthernet0/1.30
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip nat inside
 ip access-group ADMIN-INBOUND-ACL in
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip access-list standard NAT-PERMIT-ACL
 permit 192.168.10.0 0.0.0.255
 permit 192.168.30.0 0.0.0.255
ip nat inside source list NAT-PERMIT-ACL interface GigabitEthernet0/0 overload
ip access-list extended CORP-INBOUND-ACL
 deny tcp any any eq 23 log
 deny ip any 192.168.20.0 0.0.0.255 log
 remark Return traffic from corporate hosts managed by the jump host
 permit tcp 192.168.10.0 0.0.0.255 eq 22 host 192.168.30.10 established
 deny ip any 192.168.30.0 0.0.0.255 log
 permit tcp 192.168.10.0 0.0.0.255 any eq 443
 permit udp 192.168.10.0 0.0.0.255 host 8.8.8.8 eq 53
 permit icmp 192.168.10.0 0.0.0.255 host 198.51.100.10 echo
 deny ip any any log
ip access-list extended OT-INBOUND-ACL
 deny tcp any any eq 23 log
 remark Limited response rules, not stateful inspection
 permit tcp 192.168.20.0 0.0.0.255 eq 22 host 192.168.30.10 established
 permit tcp host 192.168.20.10 eq 3389 host 192.168.30.10 established
 deny ip any any log
ip access-list extended ADMIN-INBOUND-ACL
 deny tcp any any eq 23 log
 permit tcp host 192.168.30.10 192.168.10.0 0.0.0.255 eq 22
 permit tcp host 192.168.30.10 192.168.20.0 0.0.0.255 eq 22
 permit tcp host 192.168.30.10 host 192.168.20.10 eq 3389
 permit tcp host 192.168.30.10 host 192.168.30.1 eq 22
 deny ip any 192.168.10.0 0.0.0.255 log
 deny ip any 192.168.20.0 0.0.0.255 log
 permit tcp 192.168.30.0 0.0.0.255 any eq 443
 permit udp 192.168.30.0 0.0.0.255 host 8.8.8.8 eq 53
 permit icmp 192.168.30.0 0.0.0.255 host 198.51.100.10 echo
 deny ip any any log
ip access-list extended WAN-INBOUND-ACL
 remark IOS outside ingress ACL sees public destination before NAT
 permit tcp any eq 443 host 203.0.113.2 established
 permit udp host 8.8.8.8 eq 53 host 203.0.113.2 gt 1023
 permit icmp host 198.51.100.10 host 203.0.113.2 echo-reply
 deny ip any any log
ip access-list standard VTY-ADMIN
 permit host 192.168.30.10
 deny any
ip ssh version 2
line vty 0 4
 access-class VTY-ADMIN in
 transport input ssh
 login local
 exec-timeout 5 0
line console 0
 exec-timeout 5 0
 logging synchronous
end
